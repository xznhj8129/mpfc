# Runtime-neutral appliance base configuration.
# deploy/rpi/run-mpfc injects node identity, HiveLink addressing and the
# concrete MAVSDK connection from /etc/mpfc/runtime.env plus VM overrides.
my_name: appliance
runtime_mode: resident

vehicle:
  autopilot: Autopilot.PX4
  airframe: Airframe.COPTER
  telem_type: Telemetry.MAVLINK

core:
  name: execution_host
  cfg:
    id: execution_host
    poll_interval_s: 0.25

bus_config:
  schema_path: /opt/mpfc/config/bus_topics_schema.json
  log_file: /var/log/mpfc/hivebus.log
  endpoint:
    type: mqtt
    host: 127.0.0.1
    port: 1883

plugins:
- plugin: hivelink_interface
  cfg:
    link_config:
      my_name: appliance
      nodemap: {}

- plugin: execution_ingress
  cfg:
    id: execution_ingress
    auto_takeoff_for_move: false
    asset_id: <my_name>

- plugin: uav_controller
  cfg:
    id: uav_controller
    topic_ns: UAV
    poll_interval_s: 0.1
    response_timeout_s: 20.0

- plugin: mavsdk_interface
  cfg:
    id: mavsdk
    topic_ns: UAV
    is_interface: true
    conn_str: runtime://required
    mav_dialect: PX4
    mav_type: MAV_TYPE_QUADROTOR
    mav_sysid: 1
    mavsdk_log_debug: false
    state_intervals:
      flight_control: 0.1
      location: 0.1
      attitude: 0.1
      angular_velocity: 0.1
      gnss: 0.5
      power: 0.5
      firmware: 1.0
