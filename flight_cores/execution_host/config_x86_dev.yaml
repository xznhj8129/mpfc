# Fast native x86 development runtime for the Block 1 execution path.
# The QEMU user network exposes the host to the guest at 10.0.2.2.
# sigmac3 forwards host UDP 14540 to this guest for PX4 SIH and host UDP
# 15555 to guest UDP 5555 for control-side HiveLink delivery.
my_name: uav1
runtime_mode: resident

vehicle:
  autopilot: AutopilotType.PX4
  airframe: AirframeType.COPTER
  telem_type: TelemetryType.MAVLINK

core:
  name: execution_host
  cfg:
    id: execution_host
    poll_interval_s: 0.25

bus_config:
  schema_path: /opt/mpfc/config/bus_topics_schema.json
  log_file: /var/log/mpfc/hivebus.log
  endpoint:
    type: mqtt
    host: 127.0.0.1
    port: 1883

plugins:
- plugin: hivelink_interface
  cfg:
    id: hivelink
    rx_poll_interval: 0.05
    bus_poll_interval: 0.05
    in_topic: OCCID/IN
    out_topic: OCCID/OUT
    link_config:
      my_name: uav1
      my_id: 0
      udp:
        use: true
        host: 0.0.0.0
        port: 5555
        use_multicast: false
        multicast_group: ''
        multicast_port: 5555
      meshtastic:
        use: false
        radio_serial: ''
        app_portnum: 260
        channel: 0
      nodemap:
        control:
          ip:
          - 10.0.2.2
          - 5555

- plugin: execution_ingress
  cfg:
    id: execution_ingress
    topic_ns: EXECUTION
    auto_takeoff_for_move: true

- plugin: uav_controller
  cfg:
    id: uav_controller
    topic_ns: UAV
    poll_interval_s: 0.1
    response_timeout_s: 20.0

- plugin: mavsdk_interface
  cfg:
    id: mavsdk
    topic_ns: UAV
    is_interface: true
    conn_type: udp
    conn_str: udpin://0.0.0.0:14540
    mav_dialect: PX4
    mav_type: MAV_TYPE_QUADROTOR
    mav_sysid: 1
    mavsdk_log_debug: false
    state_intervals:
      flight_control: 0.1
      location: 0.1
      attitude: 0.1
      angular_velocity: 0.1
      gnss: 0.5
      power: 0.5
      firmware: 1.0
