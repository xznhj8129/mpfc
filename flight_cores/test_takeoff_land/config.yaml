my_name: uav1
vehicle:
  autopilot: Autopilot.ARDUPILOT
  airframe: Airframe.COPTER
  telem_type: Telemetry.MAVLINK
core:
  name: test_takeoff_land
  cfg:
    id: mav_core
    mav_port: 14550
    mission:
      takeoff_altitude_m: 10.0
      takeoff_altitude_ok_fraction: 0.8
      post_takeoff_wait_s: 5.0
      go_north_distance_m: 50.0
      goto_arrival_radius_m: 1.0
      goto_yaw_deg: 0.0
      target_altitude_m: 25.0
      altitude_tolerance_m: 1.0
      altitude_change_timeout_s: 120.0
      home_arrival_radius_m: 1.0
      land_altitude_threshold_m: 0.5
      poll_interval_s: 0.5
      goto_timeout_s: 120.0
      rtl_timeout_s: 180.0
      land_timeout_s: 120.0
      state_timeout_s: 60.0
      response_timeout_s: 20.0
    state_keys:
    - flight_control
    - location
    - attitude
    - angular_velocity
bus_config:
  schema_path: ../../config/bus_topics_schema.json
  log_file: hivebus.log
  endpoint:
    type: mqtt
    host: 127.0.0.1
    port: 1883
plugins:
- plugin: uav_controller
  cfg:
    id: uav_controller
    topic_ns: UAV
    poll_interval_s: 0.1
    response_timeout_s: 20.0
- plugin: mavsdk_interface
  cfg:
    id: mavsdk
    topic_ns: UAV
    is_interface: true
    conn_type: udp
    conn_str: udp://:<mav_port>
    mav_dialect: ArduPilot
    mav_type: MAV_TYPE_QUADROTOR
    mav_sysid: 1
    mavsdk_log_debug: false
    state_intervals:
      flight_control: 0.1
      location: 0.1
      attitude: 0.1
      angular_velocity: 0.1
      gnss: 0.5
      power: 0.5
      firmware: 1.0
