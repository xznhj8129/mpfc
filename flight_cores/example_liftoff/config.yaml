my_name: uav1
vehicle:
  autopilot: Autopilot.CUSTOM
  airframe: Airframe.COPTER
  telem_type: Telemetry.MANUAL_ENTRY
core:
  name: example_liftoff
  cfg:
    id: example_liftoff_core
    poll_interval_s: 0.1
    print_interval_s: 1.0
    state_timeout_s: 20.0
    response_timeout_s: 2.0

bus_config:
  schema_path: ../../config/bus_topics_schema.json
  log_file: hivebus.log
  endpoint:
    type: mqtt
    host: 127.0.0.1
    port: 1883

plugins:
- plugin: uav_controller
  cfg:
    id: uav_controller
    topic_ns: UAV
    poll_interval_s: 0.1
    response_timeout_s: 2.0
- plugin: liftoff_interface
  cfg:
    id: liftoff
    topic_ns: UAV
    is_interface: true
    telemetry_host: 0.0.0.0
    telemetry_port: 9001
    socket_timeout_s: 0.2
    link_timeout_s: 1.0
    packet_buffer_size: 1024
    in_air_alt_threshold: 0.5
    state_intervals:
      flight_control: 0.2
      location: 0.1
      attitude: 0.1
      rc_telemetry: 0.1
      power: 0.5
