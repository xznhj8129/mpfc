my_name: uav1

vehicle:
  autopilot: FCAutopilotType.PX4
  uav_type: UAVType.Copter
  telem_type: TelemType.Mavlink2

core:
  name: lattice_demo
  cfg:
    id: lattice_core
    poll_interval_s: 0.2

    lattice:
      id: lattice
      topic_ns: LATTICE
    mission:
      id: mission
      topic_ns: MISSION

    state_keys:
    - IsHomePositionOk
    - IsGlobalPositionOk
    - IsArmed
    - IsInAir
    - AltitudeM
    - Position
    - SensorConfig
    - ActiveModeNames
    lattice_state_keys:
    - LastOkAgeS

    state_logging:
      keys:
      - IsInAir
      - IsArmed
      - AltitudeM
      interval_s: 0.5
      prefix: CORE

    # demo mission policy (no task targets are configured; tasks arrive over Lattice)
    policy:
      takeoff_altitude_m: 10.0
      takeoff_altitude_ok_fraction: 0.8
      post_takeoff_wait_s: 1.0
      arrival_radius_m: 3.0
      arrival_altitude_tolerance_m: 2.0
      execution_timeout_s: 240.0
      progress_interval_s: 1.0
      fetch_interval_s: 0.5
      state_timeout_s: 60.0
      response_timeout_s: 20.0
      # Lattice link-loss failsafe bound; safe action when armed
      link_loss_timeout_s: 60.0
      failsafe_action: rtl
      cancellation_action: rtl
      cancellation_timeout_s: 240.0
      # Configure WGS84 home HAE explicitly; AbsAltM telemetry is AMSL.
      home_altitude_hae_m: null

bus_config:
  schema_path: ../../config/bus_topics_schema.json
  log_file: hivebus.log
  endpoint:
    type: mqtt
    host: 127.0.0.1
    port: 1883

plugins:
- plugin: px4_sitl_gz_launcher
  cfg:
    id: px4_sitl
    auto_start: true

    px4:
      px4_dir: "../../px4dev/PX4-Autopilot/"
      sitl_vehicle: "gz_x500_mono_cam"
      companion_mavlink_port: 14540
      qgc_mavlink_port: 14550
      qgc_mavlink_enabled: false
      qgc_local_port: 18571
      home_lat: 36.530440
      home_lon: -83.216383
      home_alt: 0
      model_pose: ""

    gazebo:
      gz_world: "default"
      gz_ip: 127.0.0.1
      gz_gui: true
      video_host_ip: 127.0.0.1
      video_host_port: 5601

- plugin: lattice
  cfg:
    id: lattice
    topic_ns: LATTICE
    # Lattice asset identity used for the agent selector and entity id
    asset_id: mpfc-uav
    base_url: https://127.0.0.1:8443
    client_id: mpfc
    client_secret: mpfc
    # vehicle state consumed for entity publishing
    interface:
      id: uav_controller
      topic_ns: UAV

- plugin: mission
  cfg:
    id: mission
    topic_ns: MISSION

- plugin: uav_controller
  cfg:
    id: uav_controller
    topic_ns: UAV
    poll_interval_s: 0.1
    response_timeout_s: 20.0

- plugin: mavsdk_interface
  cfg:
    id: mavsdk
    topic_ns: UAV
    is_interface: true
    conn_type: udp
    conn_str: udpin://0.0.0.0:14540
    mav_dialect: PX4
    mav_type: MAV_TYPE_QUADROTOR
    mav_sysid: 1
    mavsdk_log_debug: false
