plugin: liftoff_interface
cfg:
  id: liftoff
  topic_ns: UAV
  is_interface: true
  supports:
    autopilot:
    - Autopilot.CUSTOM
    telem_type:
    - Telemetry.MANUAL_ENTRY
  telemetry_host: 0.0.0.0
  telemetry_port: 9001
  socket_timeout_s: 0.2
  link_timeout_s: 1.0
  packet_buffer_size: 1024
  in_air_alt_threshold: 0.5
  state_intervals:
    flight_control: 0.2
    location: 0.1
    attitude: 0.1
    rc_telemetry: 0.1
    power: 0.5
