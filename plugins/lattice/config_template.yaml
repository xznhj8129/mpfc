plugin: lattice
cfg:
  # required bus client id for this Lattice interface
  id: lattice
  # required topic namespace shared with core/plugin clients (for example: LATTICE)
  topic_ns: LATTICE
  is_interface: true
  # required Lattice API base URL (local Lattice-compatible server)
  base_url: https://127.0.0.1:8443
  # TLS verification: set false to disable, or set ca_bundle to a CA file path
  tls_verify: true
  ca_bundle: null
  # token credentials: client_id + client_secret, or a static token
  client_id: null
  client_secret: null
  token: null
  # optional token endpoint override; defaults to <base_url>/api/v1/oauth/token
  token_endpoint: null
  # HTTP request timeout and SDK retry count
  timeout_s: 10.0
  max_retries: 2
  # delay before a failed connection is retried
  reconnect_secs: 5.0
  # required Lattice asset identity used by the agent selector and published entity
  asset_id: mpfc-uav
  # required; entity display name (aliases.name), null uses asset_id
  callsign: null
  # required; false = receive-only edge: no agent listener, no task recovery, empty task catalog
  accept_tasks: true
  # Native SDK components owned by this publisher; field setup supplies group membership.
  relationships: null
  group_details: null
  # Location and attitude expire independently of the edge process and live video.
  telemetry_freshness_s: 3.0
  # required; video sources registered as Lattice Video API ingress streams <asset_id>.<source>
  # and referenced from the entity, e.g. [{source: front, url: rtsp://127.0.0.1:8554/uav1-front}]
  media: []
  # required; null, or detector source + stabilized gimbal camera for detection -> Lattice track entities <asset_id>.trk.<tracker_id>
  # Geospatial contacts default to the TAK marker lifetime: 86400 seconds from the last observation.
  # e.g. {source: {id: yolo, topic_ns: CV}, camera: {image_w: 1280, image_h: 720, hfov_deg: 90, vfov_deg: 60, pitch_deg: -45, min_pitch_deg: -90, max_pitch_deg: 10}}
  detections: null
  # required vehicle state interface consumed for entity publishing
  interface:
    id: uav_controller
    topic_ns: UAV
  # required vehicle state fields used to encode the published entity
  vehicle_state_keys:
    - FcConnected
    - Position
    - AttitudeRad
    - Battery
    - IsArmed
    - IsInAir
    - ActiveModeNames
  # Lattice entity refresh interval and expiry
  state_publish_interval_s: 1.0
  entity_expiry_s: 15.0
  # Explicit WGS84 home HAE datum; null omits HAE from node information.
  # AbsAltM from MSP/MAVSDK is AMSL, and RelAltM is home-relative, not AGL.
  home_altitude_hae_m: null
  # Reoffer a fetched task until the core acknowledges it.
  task_fetch_lease_s: 30.0
  # agent listen long-poll timeout, bounded call retries
  listen_timeout_s: 300.0
  lattice_attempts: 3
  lattice_retry_delay_s: 1.0
  # required publish intervals in seconds keyed by LATTICE.State field name
  state_intervals:
    Connected: 0.1
    Endpoint: 0.5
    ConnectAttempts: 0.5
    LastOkAgeS: 0.5
    TokenValid: 0.5
    PendingCount: 0.5
    LastTask: 0.5
    LatitudeDeg: 1.0
    LongitudeDeg: 1.0
    AltitudeAglM: 1.0
    AltitudeHaeM: 1.0
    AttitudeEnuW: 1.0
    AttitudeEnuX: 1.0
    AttitudeEnuY: 1.0
    AttitudeEnuZ: 1.0
    PublishCount: 1.0
    LastPublishAtMs: 1.0
    LastError: 0.5
    LastErrorOperation: 0.5
    LastErrorEndpoint: 0.5
  loop_interval_s: 0.1
  bus_poll_interval_s: 0.01
