plugin: execution_ingress
cfg:
  id: execution_ingress
  poll_interval_s: 0.1
  response_timeout_s: 20.0
  state_timeout_s: 60.0
  execution_timeout_s: 180.0
  progress_interval_s: 1.0
  arrival_radius_m: 3.0
  arrival_altitude_tolerance_m: 2.0
  auto_takeoff_for_move: false
  takeoff_altitude_m: 10.0
  takeoff_altitude_ok_fraction: 0.8
  post_takeoff_wait_s: 1.0
  control_node: control
  state_publish_interval_s: 1.0
  occid_in_topic: OCCID/IN
  occid_out_topic: OCCID/OUT
  interface:
    id: uav_controller
    topic_ns: UAV
