plugin: execution_ingress
cfg:
  id: execution_ingress
  poll_interval_s: 0.1
  response_timeout_s: 20.0
  state_timeout_s: 60.0
  execution_timeout_s: 180.0
  progress_interval_s: 1.0
  arrival_radius_m: 3.0
  arrival_altitude_tolerance_m: 2.0
  auto_takeoff_for_move: false
  takeoff_altitude_m: 10.0
  takeoff_altitude_ok_fraction: 0.8
  post_takeoff_wait_s: 1.0
  state_publish_interval_s: 1.0
  # Lattice agent endpoint (official anduril-lattice-sdk).  The deployment may
  # also supply these through LATTICE_ENDPOINT / LATTICE_CLIENT_ID /
  # LATTICE_CLIENT_SECRET / SANDBOXES_TOKEN.
  lattice_endpoint: localhost:8443
  lattice_client_id: mpfc
  lattice_client_secret: mpfc
  sandboxes_token: ''
  # Bounded retries for every Lattice exchange (listen/publish/status).  Every
  # failed attempt is logged with endpoint, operation, task id, and cause.
  lattice_attempts: 3
  lattice_retry_delay_s: 1.0
  # Agent listen is a long poll: the server may hold it for minutes, so it uses
  # its own timeout instead of the command-response timeout.
  lattice_listen_timeout_s: 300.0
  # HAE home altitude required to command/evaluate HAE task objectives.  When
  # null it is derived at startup from live telemetry
  # (absolute_altitude - relative_altitude); if neither source is available
  # the plugin faults visibly instead of guessing a datum.
  home_altitude_hae_m: null
  home_altitude_timeout_s: 60.0
  # Link/manager-loss failsafe: after this long without any successful Lattice
  # exchange the armed vehicle executes failsafe_action (rtl or land) once.
  link_loss_timeout_s: 60.0
  failsafe_action: rtl
  interface:
    id: uav_controller
    topic_ns: UAV
