plugin: atak_interface
cfg:
  id: atak
  # routing namespace only; bus payloads are Lattice Entity documents
  topic_ns: ATAK
  is_interface: true
  state_intervals:
    entity_state: 0.05
    cot_raw: 0.05
  loop_interval_s: 0.1
  bus_poll_interval_s: 0.01
  recv_buffer_bytes: 65535
  multicast_ttl: 2
  listen:
    host: 0.0.0.0
    port: 4242
  multicast_group: 239.2.3.1
  cot_output_targets:
  - host: 239.2.3.1
    port: 4242
  tcp_listen:
    enabled: true
    host: 0.0.0.0
    port: 8088
  tcp_connect:
    enabled: true
    host: 127.0.0.1
    port: 8087
    reconnect_secs: 3.0
  translator:
    stale_seconds: 60
    default_ce: 50.0
    default_le: 50.0
    self_callsign: MPFC
    self_cottype: a-f-U
