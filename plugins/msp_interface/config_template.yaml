plugin: msp_interface
cfg:
  id: mspapi
  topic_ns: UAV
  is_interface: true
  supports:
    autopilot:
    - Autopilot.INAV
    - Autopilot.BETAFLIGHT
    telem_type:
    - Telemetry.MSP
  is_datalink: false
  conn_type: serial
  conn_str: /dev/ttyACM0
  conn_bitrate: 115200
  conn_read_timeout_s: 0.05
  conn_write_timeout_s: 0.2
  conn_max_retries: 1
  conn_reconnect_delay_s: 0.5
  state_poll_interval_s: 0.5
  in_air_alt_threshold: 0.5
  home_min_satellites: 6
  takeoff_throttle: 1700
  hover_throttle: 1500
  landing_throttle: 1300
  takeoff_timeout_s: 45.0
  landing_timeout_s: 45.0
  override_send_interval: 0.04
  control_override_timeout_s: 0.3
  override_channels:
    roll: roll
    pitch: pitch
    yaw: yaw
    throt: throttle
  go_to_waypoint:
    WaypointIndex: 255
    Action: 1
    Param1: 0
    Param2: 0
    Param3: 0
    Flag: 0
  state_intervals:
    flight_control: 0.2
    location: 0.2
    attitude: 0.1
    angular_velocity: 0.1
    gnss: 0.5
    autopilot_mission: 0.5
    power: 0.5
    imu: 0.2
    sensor_config: 1.0
    rc_telemetry: 0.2
    remote_control: 0.5
    control_override: 0.2
    control_output: 0.2
    runtime_load: 0.5
